# ============================================================
# Sveltia CMS 配置 · xiaoguaiguai.cn 家庭资源导航
# 仓库：FBX-Dev/xiaoguaiguai-nav  分支：main
# 后台入口：https://xiaoguaiguai.cn/admin
# OAuth 代理：https://xiaoguaiguai.cn/oauth/*（Cloudflare Worker，绑定主域名）
# 资源图片：Cloudflare R2 桶 xiaoguaiguai-media，cover 仅填 R2 公开 URL
# ============================================================

backend:
  name: github
  repo: FBX-Dev/xiaoguaiguai-nav
  branch: main
  # 登录方式：
  #   token → 粘贴 GitHub Personal Access Token（需 repo 权限），无需 OAuth App，可立即使用
  #   oauth → 走 /oauth/* 代理的 GitHub 授权（需人工创建 OAuth App 并写入 Worker 环境变量）
  auth_methods: [token, oauth]
  # OAuth 代理走主域名，不使用任何子域名
  base_url: https://xiaoguaiguai.cn
  auth_endpoint: oauth/authorize
  commit_messages:
    create: 'content: 新增 {{collection}} "{{slug}}"'
    update: 'content: 更新 {{collection}} "{{slug}}"'
    delete: 'content: 删除 {{collection}} "{{slug}}"'
    uploadMedia: 'content: 上传媒体 "{{path}}"'
    deleteMedia: 'content: 删除媒体 "{{path}}"'

# 配图统一存放 Cloudflare R2 桶 xiaoguaiguai-media，通过 Worker 反代到主域名 /media/* 对外提供。
# 上传方式：wrangler r2 object put（详见 _deliverables/R2配图上传指引.md）
# 公开地址格式：https://xiaoguaiguai.cn/media/<分类>/<序号>-<语义>.webp
# 说明：不用子域名（规范约束），也不用 r2.dev（国内被墙），故走主域名子路径反代。
# 下面两项仅为消除 CMS 的「未定义媒体文件夹」报错、保证后台表单正常加载；
# 配图请走 R2 上传后把公开地址直接粘贴到 cover 字段，不要走媒体库上传。
media_folder: media
public_folder: /media

site_url: https://xiaoguaiguai.cn
display_url: https://xiaoguaiguai.cn
logo_url: https://xiaoguaiguai.cn/favicon.ico

locale: zh_Hans

# 关闭首期不需要的编辑器功能，保持极简
publish_mode: simple
slug:
  encoding: unicode
  clean_accents: false

collections:
  - name: nav
    label: 导航数据
    label_singular: 导航数据
    description: >-
      首页五个固定一级分类的内容与工具条目。分类名称（含 emoji 与空格）不可修改，
      每个分类需保持 内容条目 ≥ 5 条、工具条目 ≥ 2 款。
    files:
      - name: nav_data
        label: 导航条目（nav.json）
        file: nav.json
        description: >-
          分类固定 5 个：🧸 婴幼儿养育 / 📖 儿童教育 / 🌷 女性成长 /
          🏠 家庭关系 / 💞 两性亲密成长。
        fields:
          - name: site
            label: 站点信息
            widget: object
            fields:
              - { name: title, label: 站点名称, widget: string }
              - { name: subtitle, label: 副标题, widget: string }
              - { name: disclaimer, label: 免责声明, widget: text }

          - name: categories
            label: 一级分类
            label_singular: 分类
            widget: list
            summary: "{{fields.name}}"
            fields:
              - name: name
                label: 分类名称（固定，不可改）
                widget: string
                hint: 含 emoji 与空格，请勿修改
              - name: items
                label: 条目列表
                label_singular: 条目
                widget: list
                summary: "[{{fields.type}}] {{fields.title}}"
                fields:
                  - name: title
                    label: 标题
                    widget: string
                    hint: 12 字以内优先，温和抓人
                  - name: desc
                    label: 摘要
                    widget: text
                    hint: 30～60 字，说明能帮用户解决什么问题，共情调性
                  - name: url
                    label: 跳转链接
                    widget: string
                    hint: 第三方平台链接，页面会以新标签打开
                  - name: cover
                    label: 封面（R2 公开地址）
                    widget: string
                    required: false
                    hint: 留空则不渲染图片；有图时填 https://xiaoguaiguai.cn/media/分类/序号-语义.webp
                  - name: type
                    label: 类型
                    widget: select
                    options:
                      - { label: 内容 content, value: content }
                      - { label: 工具 tool, value: tool }
                    default: content
                  - name: tags
                    label: 标签
                    widget: list
                    required: false
                    field: { name: tag, label: 标签, widget: string }

  # ----------------------------------------------------------
  # 文章内容（folder collection）
  # 每篇一个 .md 文件，存放在仓库 posts/ 目录。
  # 新建 / 编辑 / 删除 / 发布 均在本后台完成；保存即提交到 GitHub，
  # 由 GitHub Actions 触发构建并部署到 Cloudflare Pages。
  # ----------------------------------------------------------
  - name: posts
    label: 内容文章
    label_singular: 文章
    description: >-
      家庭与成长主题文章。每篇文章对应 posts/ 目录下的一个 .md 文件。
      保存后需等待约 1～2 分钟，自动构建完成后线上生效。
      每个一级分类建议保持不少于 4 篇。
    folder: posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}（{{date}}）"
    sortable_fields: [date, title]
    view_filters:
      - { label: 婴幼儿养育, field: category, pattern: "🧸 婴幼儿养育" }
      - { label: 儿童教育, field: category, pattern: "📖 儿童教育" }
      - { label: 女性成长, field: category, pattern: "🌷 女性成长" }
      - { label: 家庭关系, field: category, pattern: "🏠 家庭关系" }
      - { label: 两性亲密成长, field: category, pattern: "💞 两性亲密成长" }
      - { label: 草稿, field: draft, pattern: true }
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 建议 8～18 字，具体、不夸张、不制造焦虑
      - name: date
        label: 发布日期
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: 决定首页「最新内容」的排序，越新越靠前
      - name: category
        label: 所属分类（固定 5 个，不可新增）
        widget: select
        options:
          - "🧸 婴幼儿养育"
          - "📖 儿童教育"
          - "🌷 女性成长"
          - "🏠 家庭关系"
          - "💞 两性亲密成长"
        hint: 与首页一级分类一一对应
      - name: excerpt
        label: 摘要
        widget: text
        hint: 40～70 字，出现在列表卡片与首页索引上
      - name: cover
        label: 封面地址（可留空）
        widget: string
        required: false
        hint: >-
          留空则自动使用该分类的默认配图。如需自定义，填
          https://xiaoguaiguai.cn/media/covers/xxx.webp
      - name: tags
        label: 标签
        widget: list
        required: false
        field: { name: tag, label: 标签, widget: string }
      - name: draft
        label: 草稿（不发布）
        widget: boolean
        required: false
        default: false
        hint: 勾选后该文章不会出现在任何页面
      - name: body
        label: 正文
        widget: markdown
        hint: >-
          支持 Markdown。一级标题由系统自动生成，正文请从二级标题（##）写起。
          涉及健康、育儿、心理话题时，请保留文末的免责表述。
