name: Deploy to Cloudflare Pages

# 触发条件：
#   - main 分支推送（内容/工具/后台配置变更后自动上线）
#   - 手动触发（Actions 页点 Run workflow，用于补救或强制重发）
#
# 关键点：CMS 在后台保存文章 = 向 main 提交一次 commit，
# 因此「后台点保存」到「线上生效」全自动，无需本地介入。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

# 同一时间只跑一个部署，新推送取消排队中的旧任务，避免并发写同一 Pages 项目
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    # 钉住具体版本而非 ubuntu-latest：GitHub 会随 ubuntu-latest 的指向自动迁移 runner
    # （2026-10-19 起迁往 Ubuntu 26），迁移前后 Node 运行时/镜像差异可能影响构建，
    # 且每次迁移都会产生一条 notice 注解。钉住后构建环境可预测，注解也不再出现。
    # 维护点：Ubuntu 24.04 被弃用时（GitHub 会提前数月公告）改成新的 LTS 编号即可。
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # 三个 action 均使用 node24 运行时（checkout v7 / setup-node v7 / wrangler-action v4）。
      # 旧版 v4/v4/v3 声明的是 node20，在 Node 24 runner 上会被强制提权并产生
      # "Node.js 20 is deprecated" 警告注解，故统一升到 node24 版本。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 构建脚本零依赖（只用 node: 内置模块），因此不需要 npm ci / cache，
      # 也就不会因为 lock 文件缺失或私有源问题导致 CI 失败。
      - name: Build static site
        run: node build.mjs

      # 部署前自检：产物缺失即提前失败，避免把空站推上线
      - name: Verify build output
        run: |
          set -e
          for f in _dist/index.html _dist/404.html _dist/posts.json _dist/tools.json \
                   _dist/posts/index.html _dist/tools/index.html _dist/admin/config.yml \
                   _dist/sitemap.xml _dist/robots.txt; do
            if [ ! -f "$f" ]; then echo "::error::缺少构建产物 $f"; exit 1; fi
          done
          POSTS=$(node -e "console.log(require('./_dist/posts.json').count)")
          TOOLS=$(node -e "console.log(require('./_dist/tools.json').count)")
          echo "文章 $POSTS 篇 / 工具 $TOOLS 个"
          if [ "$POSTS" -lt 1 ]; then echo "::error::文章数为 0，疑似构建异常"; exit 1; fi
          if [ "$TOOLS" -lt 1 ]; then echo "::error::工具数为 0，疑似构建异常"; exit 1; fi
          # 硬指标：每个分类文章 ≥4 篇、实用工具 ≥4 个
          for cat in "🧸 婴幼儿养育" "📖 儿童教育" "🌷 女性成长" "🏠 家庭关系" "💞 两性亲密成长"; do
            PC=$(node -e "console.log(require('./_dist/posts.json').posts.filter(p=>p.category==='$cat').length)")
            TC=$(node -e "console.log(require('./_dist/tools.json').tools.filter(t=>t.category==='$cat').length)")
            echo "  $cat → 文章 $PC / 工具 $TC"
            if [ "$PC" -lt 4 ]; then echo "::error::$cat 文章不足 4 篇（实际 $PC）"; exit 1; fi
            if [ "$TC" -lt 4 ]; then echo "::error::$cat 实用工具不足 4 个（实际 $TC）"; exit 1; fi
          done
          for s in $(node -e "require('./_dist/posts.json').posts.forEach(p=>console.log(p.slug))"); do
            if [ ! -f "_dist/posts/$s/index.html" ]; then echo "::error::缺文章页 $s"; exit 1; fi
          done
          for s in $(node -e "require('./_dist/tools.json').tools.forEach(t=>console.log(t.slug))"); do
            if [ ! -f "_dist/tools/$s/index.html" ]; then echo "::error::缺工具页 $s"; exit 1; fi
          done
          # 文章 ↔ 工具 双向互链：每个工具的引导文章必须存在，且两侧产物都要渲染出链接。
          # 判据取产物而非源文件 —— 源里写了字段但 build 没渲染出来，是真实上线事故。
          GCOUNT=0
          for g in $(node -e "require('./_dist/tools.json').tools.forEach(t=>console.log(t.guide||''))"); do
            if [ -z "$g" ]; then echo "::error::存在未绑定引导文章的工具"; exit 1; fi
            if [ ! -f "_dist/posts/$g/index.html" ]; then echo "::error::缺引导文章 $g"; exit 1; fi
            if ! grep -q 'class="tool-link"' "_dist/posts/$g/index.html"; then
              echo "::error::引导文章 $g 未渲染文末工具卡片"; exit 1
            fi
            GCOUNT=$((GCOUNT + 1))
          done
          echo "  双向互链：$GCOUNT 组引导文章"
          for s in $(node -e "require('./_dist/tools.json').tools.forEach(t=>console.log(t.slug))"); do
            if ! grep -q 'class="guide-link"' "_dist/tools/$s/index.html"; then
              echo "::error::工具页 $s 未渲染顶部配套阅读入口"; exit 1
            fi
          done
          # 5 个固定分类页必须齐全（顶部导航直接指向它们）
          for s in yuer jiaoyu nvxing jiating qinmi; do
            if [ ! -f "_dist/category/$s/index.html" ]; then echo "::error::缺分类页 $s"; exit 1; fi
          done
          # 合规页必须齐全（Google AdSense 审核与搜索评估的必需项）
          for s in about privacy disclaimer terms contact; do
            if [ ! -f "_dist/$s/index.html" ]; then echo "::error::缺合规页 /$s/"; exit 1; fi
          done
          # 隐私政策必须写明第三方广告与 Cookie 退出方式
          for kw in AdSense Cookie 个性化广告 adssettings.google.com; do
            if ! grep -q "$kw" _dist/privacy/index.html; then
              echo "::error::隐私政策缺少关键词 $kw"; exit 1
            fi
          done
          # 联系邮箱必须出现在首页页脚
          if ! grep -q 'contact@xiaoguaiguai.cn' _dist/index.html; then
            echo "::error::页脚缺少联系邮箱"; exit 1
          fi
          # sitemap 必须覆盖首页与全部文章，且不收录后台
          if ! grep -q '<loc>https://xiaoguaiguai.cn/</loc>' _dist/sitemap.xml; then
            echo "::error::sitemap 缺首页"; exit 1
          fi
          SLOC=$(grep -c '<loc>' _dist/sitemap.xml || true)
          echo "sitemap 条目 $SLOC"
          if [ "$SLOC" -lt "$POSTS" ]; then echo "::error::sitemap 条目少于文章数"; exit 1; fi
          if grep -q '/admin' _dist/sitemap.xml; then echo "::error::sitemap 不应收录 /admin/"; exit 1; fi
          if ! grep -q 'Sitemap: https://xiaoguaiguai.cn/sitemap.xml' _dist/robots.txt; then
            echo "::error::robots.txt 未声明 sitemap"; exit 1
          fi
          if ! grep -q 'Disallow: /admin/' _dist/robots.txt; then
            echo "::error::robots.txt 未屏蔽 /admin/"; exit 1
          fi
          # CF 托管 robots 会误把 Baiduspider/PetalBot 写成 Disallow，必须显式放行
          RBT=$(tr '\n' '|' < _dist/robots.txt)
          case "$RBT" in
            *"User-agent: Baiduspider|Allow: /"*) ;;
            *) echo "::error::robots.txt 未显式放行 Baiduspider"; exit 1 ;;
          esac
          case "$RBT" in
            *"User-agent: PetalBot|Allow: /"*) ;;
            *) echo "::error::robots.txt 未显式放行 PetalBot"; exit 1 ;;
          esac
          case "$RBT" in
            *"User-agent: GPTBot|Disallow: /"*) ;;
            *) echo "::error::robots.txt 未拒绝 GPTBot"; exit 1 ;;
          esac
          # 首页必须真的含内容（防止生成空壳）
          if ! grep -q 'class="hero-pick"' _dist/index.html; then
            echo "::error::首页缺少焦点推荐区块"; exit 1
          fi
          # 列表页必须是纯文字索引（本轮改版核心：列表不再用配图）
          if ! grep -q 'class="index"' _dist/index.html; then
            echo "::error::首页缺少纯文字索引"; exit 1
          fi
          if grep -q 'class="thumb"' _dist/index.html; then
            echo "::error::首页列表仍残留配图"; exit 1
          fi
          # 首页品牌区已移除（用户要求：与焦点图合占首屏、压缩阅读空间）
          if grep -q 'brand-hero' _dist/index.html; then
            echo "::error::首页仍残留品牌区（brand-hero）"; exit 1
          fi
          # 品牌区移除后首页仍需有 h1（SEO/无障碍），以视觉隐藏方式保留
          if ! grep -q 'class="sr-only"' _dist/index.html; then
            echo "::error::首页缺视觉隐藏的 h1（语义主标题丢失）"; exit 1
          fi
          # 分享卡：og:image 必须是主域名绝对地址（相对地址在微信/微博不显示）
          if ! grep -q 'property="og:image" content="https://xiaoguaiguai.cn/media/' _dist/index.html; then
            echo "::error::首页 og:image 缺失或非绝对地址"; exit 1
          fi
          # 首页工具卡固定 12 个（全站 20 个，避免首页过长）
          HCARD=$(grep -c '<a class="card" href="/tools/' _dist/index.html || true)
          if [ "$HCARD" -ne 12 ]; then
            echo "::error::首页工具卡应为 12 个（实际 $HCARD）"; exit 1
          fi
          # 术语统一：全站不应再出现「小工具」
          if grep -rq '小工具' _dist --include='*.html'; then
            echo "::error::产物中仍有「小工具」文案（应统一为「实用工具」）"; exit 1
          fi
          # 404 页必须带 noindex（缺它时未知路径回落成「200 + 首页」软 404）
          if ! grep -q 'name="robots" content="noindex"' _dist/404.html; then
            echo "::error::404.html 缺 noindex"; exit 1
          fi
          echo "✅ 产物完整性校验通过"

      # 凭据前置检查：把「部署失败」翻译成「你需要做什么」。
      # 未配置时明确失败而不是静默跳过 —— 静默跳过会让人误以为已上线。
      - name: Check deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=缺少部署凭据::未配置:$missing。请到仓库 Settings → Secrets and variables → Actions → New repository secret 添加这两个 Secret，然后重新运行本工作流。CLOUDFLARE_API_TOKEN 需要 Account → Cloudflare Pages → Edit 权限。"
            exit 1
          fi
          echo "✅ 部署凭据已配置"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 显式指定 wrangler 4：本项目的 Pages 部署走 wrangler CLI 而非 action 内置版本，
          # 固定大版本可避免 wrangler 升级带来的行为漂移（项目铁律 1）
          wranglerVersion: '4'
          command: pages deploy _dist --project-name=xiaoguaiguai-nav --branch=main
